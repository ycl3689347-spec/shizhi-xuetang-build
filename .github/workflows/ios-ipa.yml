# 在 GitHub 的 macOS 机器上把 iOS 工程编译成未签名 ipa。
#
# 为什么放云上：出 ipa 必须有 macOS + Xcode + iOS SDK，本机是 Windows 做不到。
# 这个 workflow 只负责「编译 + 打包」，不碰签名——签名留给手机端那一步
# （Windows 上用 Sideloadly / AltStore 配免费 Apple ID，见 ios/README.md）。
#
# 用法：把整个项目推到 GitHub，进 Actions 页面点 Run workflow，
# 跑完在页面底部下载 artifact：ShizhiXuetang-unsigned.ipa

name: build-ios-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'android/app/assets/www/**'
      - '.github/workflows/ios-ipa.yml'

jobs:
  build:
    # 必须是 macos-15 起步：XcodeGen 2.46 生成的是 objectVersion 77（Xcode 16 的工程格式），
    # macos-14 那台 runner 只有 Xcode 15.4，会直接报
    # "cannot be opened because it is in a future Xcode project file format (77)"。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 记录工具链版本
        # 版本不对时（比如 runner 换了镜像）先从这里看出来，不用翻几十行 xcodebuild 日志
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 同步网页资源到 iOS 工程
        run: bash ios/scripts/prepare.sh

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          cd ios
          xcodegen generate
          ls -d ShizhiXuetang.xcodeproj
          # 双保险：把工程格式标成 objectVersion 56（Xcode 14/15 都读得动）。
          # XcodeGen 会跟随最新 Xcode 写成 77，工程结构其实还是传统的 PBXGroup，
          # 降这个数字不改变语义，但能让只有 Xcode 15 的 runner 也编得动。
          if grep -q 'objectVersion = 77;' ShizhiXuetang.xcodeproj/project.pbxproj; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' ShizhiXuetang.xcodeproj/project.pbxproj
            echo "已把 objectVersion 从 77 降为 56"
          fi
          grep -m1 'objectVersion' ShizhiXuetang.xcodeproj/project.pbxproj

      - name: 编译（不签名）
        run: |
          cd ios
          xcodebuild \
            -project ShizhiXuetang.xcodeproj \
            -scheme ShizhiXuetang \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 校验产物
        run: |
          cd ios
          APP=build/Build/Products/Release-iphoneos/ShizhiXuetang.app
          test -d "$APP" || { echo "没有生成 .app"; exit 1; }
          # 网页资源必须真的在包里，否则装上是白屏
          for f in index.html app.js app.css data.js sound.js; do
            test -f "$APP/www/$f" || { echo "包里缺少 www/$f"; exit 1; }
          done
          test -f "$APP/AppIcon60x60@2x.png" -o -f "$APP/AppIcon60x60@3x.png" \
            -o -d "$APP" || true
          echo "--- .app 内容 ---"
          ls "$APP" | head -20
          echo "--- www ---"
          ls "$APP/www"

      - name: 打包成未签名 ipa
        run: |
          cd ios
          rm -rf Payload ShizhiXuetang-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShizhiXuetang.app Payload/
          zip -qry ShizhiXuetang-unsigned.ipa Payload
          ls -lh ShizhiXuetang-unsigned.ipa
          unzip -l ShizhiXuetang-unsigned.ipa | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: ShizhiXuetang-unsigned-ipa
          path: ios/ShizhiXuetang-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
